name: name_generator
description: Infinite random name generator (Flutter exercise).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'   # Flutter 3.27+ (CardThemeData, surfaceContainer colours)

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  english_words: ^4.0.0   # guided activity: random word pairs
  faker: ^2.2.0           # extension: realistic person names
  google_fonts: ^6.2.1    # extension: custom typography

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
